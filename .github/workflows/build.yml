on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  manual:
    name: Build gBar manually
    runs-on: ubuntu-latest
    container: 
      image: archlinux
    steps:
      - name: Setup Arch Keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux
      - name: Download pacman packages
        run: |
          pacman -Syu --noconfirm base-devel gcc git ninja meson gtk-layer-shell pipewire wayland libdbusmenu-gtk3 libsass python-packaging glib2-devel

      - name: Download gBar
        uses: actions/checkout@v4.1.2

      - name: Run meson
        run: |
          meson setup build

      - name: Build gBar
        run: |
          ninja -C build
